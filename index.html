const QZ={

'Verbo to be y pronombres':[['She ___ a student.',['is','are','am']],['They ___ friends.',['are','is','am']],['Negativo: He ___ not tired.',['is','are','am']],['¿Cuál pregunta es correcta?',['Are you happy?','You are happy?','Is you happy?']],['I ___ 20 years old.',['am','is','are']]],

const ld=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
let S=ld(K);
if(!S){const o=ld('estudioV2');S=o?{courses:o.courses,ses:(o.days||[]).flatMap(d=>(d.ses||[]).map(x=>({id:uid(),c:d.c,sid:d.step||'',d:d.d,s:x.s,e:x.e,m:x.m,note:d.topic||d.note||''})))}:{courses:seed(),ses:[]}}
S.courses.forEach(c=>c.levels.forEach(l=>l.steps.forEach(s=>{if(s.st==null)s.st=s.done?2:0;s.log=s.log||[];s.tests=s.tests||[]})));

let cv=S.courses[0].id,sv='cam';const cs=id=>S.courses.find(c=>c.id===id),stp=c=>c.levels.flatMap(l=>l.steps);

function cyc(c,sid){const{s}=fs(c,sid),v=(s.st+1)%3;setSt(c,sid,v);if(v===2&&QZ[s.t]&&!s.ver&&confirm('¿Quieres hacer el mini test ahora para verificarlo?'))openQ(c,sid)}

let CUR=null;const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

function gq(){let ok=0,det='';CUR.qs.forEach((q,i)=>{const r=document.querySelector(`input[name=q${i}]:checked`),good=r&&q.o[+r.value]===q.a;if(good)ok++;det+=`<p class="note">${good?'✅':'❌'} ${esc(q.q)} → <b>${esc(q.a)}</b></p>`});

function est(C){const a=stp(C),n2=a.filter(s=>s.st===2).length,ds=ses(C.id).map(x=>x.d).sort();if(n2<2||!ds.length)return null;const el=Math.max(1,(new Date(lima())-new Date(ds[0]))/864e5+1),pace=el/n2;return{pace,at:l=>{const r=l.filter(s=>s.st!==2).length;return r?fd(addD(lima(),Math.ceil(r*pace))):'Completado'}}}
function dash(){const C=cs(cv),a=stp(C),n=[0,1,2].map(v=>a.filter(s=>s.st===v).length),ver=a.filter(s=>s.st===2&&s.ver).length,S2=ses(C.id),tot=sm(S2),t=lima(),E=est(C);
 const dsid=new Set(a.filter(s=>s.st===2).map(s=>s.id)),mpt=n[2]?Math.round(sm(S2.filter(x=>dsid.has(x.sid)))/n[2]):0,N=a.length||1,R=52,Cc=2*Math.PI*R,ph=Cc*n[2]/N,pp=Cc*n[1]/N;

 <div class="card" style="--c:${C.color}"><div class="kg"><div class="kp"><b>${fh(tot)}</b>Minutos estudiados</div><div class="kp"><b>${streak(C.id)}</b>Racha (días)</div><div class="kp"><b>${n[2]?mpt+' min':'—'}</b>Promedio por tema hecho</div><div class="kp"><b>${ver} / ${n[2]}</b>Verificados / hechos</div></div><p class="note">Verificado = sacaste 80 % o más en el mini test. Autodeclarado = lo marcaste tú sin test.</p></div>
